<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watched Anime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 Watched Anime</h1>
        <p>Browse by category — click to watch!</p>
    </header>

    <div id="nav-placeholder"></div>

    <!-- Admin-only: search to add a newly watched anime -->
    <div id="adminAddBox" style="display:none;">
        <div class="recommend-form" style="max-width: 500px; margin: 20px auto;">
            <input type="text" id="watchedSearchInput" placeholder="Search an anime you watched...">
            <button id="watchedSearchBtn">Search</button>
        </div>
        <p id="watchedSearchHint" class="search-hint"></p>
        <div id="watchedSearchResults" class="scroll-container"></div>
    </div>

    <div id="watchedContainer"></div>

    <!-- Character modal -->
    <div id="animeModal" class="modal">
        <div class="modal-content">
            <span class="closeBtn">&times;</span>
            <h2 id="animeTitle"></h2>
            <div id="animeCharacters" class="characters-grid"></div>
        </div>
    </div>

    <!-- Category picker (admin only, shown when adding a new item) -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <span class="closeBtn" onclick="closeCategoryModal()">&times;</span>
            <h2>Select Category</h2>
            <div id="categoryList" class="modal-buttons-stacked"></div>
            <hr style="margin: 20px 0; border: 1px solid var(--accent); opacity: 0.3;">
            <div class="add-category-box">
                <input type="text" id="newCategoryInput" placeholder="New Category Name...">
                <button onclick="addNewCategory()" class="btn-yes" style="margin-top: 10px; width: 100%;">+ Add Category</button>
            </div>
        </div>
    </div>

    <!-- Delete confirmation (admin only) -->
    <div id="removeModal" class="modal">
        <div class="modal-content">
            <span class="closeBtn" onclick="closeRemoveModal()">&times;</span>
            <h2>Are you sure?</h2>
            <p id="removeText">This will permanently delete it.</p>
            <div class="modal-buttons-horizontal">
                <button id="confirmRemove" class="btn-yes">Yes, Delete</button>
                <button id="cancelRemove" class="btn-no" onclick="closeRemoveModal()">No, Keep it</button>
            </div>
        </div>
    </div>

    <script src="watched.js"></script>
    <script src="main.js"></script>
</body>
</html>
