<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Anime World 🎬</h1>
        <p>Explore the anime I’ve watched and those I’m still watching!</p>
    </header>

    <div id="nav-placeholder"></div>

    <section class="anime-grid">
        <div class="anime-card">
            <img src="image/mydressupdarling.jpg" alt="My Dress-Up Darling">
            <div class="overlay"><a href="https://hianime.to/my-dress-up-darling-17930" target="_blank">My Dress-Up Darling</a></div>
        </div>

        <div class="anime-card">
            <img src="image/yourname.jpg" alt="Your Name">
            <div class="overlay"><a href="https://hianime.to/your-name-10" target="_blank">Your Name</a></div>
        </div>

        <div class="anime-card">
            <img src="image/iwanttoeatyourpancreas.jpg" alt="I Want to Eat Your Pancreas">
            <div class="overlay"><a href="https://hianime.to/i-want-to-eat-your-pancreas-70" target="_blank">I Want to Eat Your Pancreas</a></div>
        </div>

        <div class="anime-card">
            <img src="image/silent voice.jpg" alt="A Silent Voice">
            <div class="overlay"><a href="https://hianime.to/a-silent-voice-11" target="_blank">A Silent Voice</a></div>
        </div>

        <div class="anime-card">
            <img src="image/weathering with you.jpg" alt="Weathering With You">
            <div class="overlay"><a href="https://hianime.to/weathering-with-you-111" target="_blank">Weathering With You</a></div>
        </div>

        <div class="anime-card">
            <img src="image/suzume.jpg" alt="Suzume">
            <div class="overlay"><a href="https://hianime.to/suzumes-doorlocking-18190" target="_blank">Suzume</a></div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
