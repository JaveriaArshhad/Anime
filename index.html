<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏠 Home</h1>
        <p>Welcome to my little corner of the internet!</p>
    </header>

    <div id="nav-placeholder"></div>

    <div class="home-page">
        <div class="page">
            <div class="framed-card">
                <h1>Hey, I'm Javeria 👋</h1>
                <p>I made this website just for fun — I kept forgetting what anime I'd already watched, so this is just my way of keeping track!</p>
            </div>

            <div class="stat-box">
                <span class="num" id="recCount">…</span>
                <span class="label">recommendations<br>received so far</span>
            </div>

            <a href="/recommendation" class="rec-btn">✨ Give a Recommendation</a>
        </div>
    </div>

    <script src="home.js"></script>
    <script src="main.js"></script>
</body>
</html>
