<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Anime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🔍 Search New Anime</h1>
        <p>Find any anime and add it to your wishlist!</p>
    </header>

    <div id="nav-placeholder"></div>


    <div class="search-page">
        <div class="recommend-form">
            <input type="text" id="searchInput" placeholder="Type anime name here...">
            <button id="searchBtn">Search</button>
        </div>
        
        <section id="resultsContainer" class="anime-grid"></section>
    </div>

    <script src="search.js"></script>
    <script src="main.js"></script>
</body>
</html>
