<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Anime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🔍 Search New Anime</h1>
        <p>Find any anime and recommend it!</p>
    </header>

    <div id="nav-placeholder"></div>


    <div class="search-page">
        <div class="recommend-form">
            <input type="text" id="searchInput" placeholder="Type anime name here...">
            <button id="searchBtn">Search</button>
        </div>
        
        <section id="resultsContainer" class="anime-grid"></section>
    </div>

    <!-- Recommend confirmation modal -->
    <div id="recommendModal" class="modal">
        <div class="modal-content">
            <span class="closeBtn" onclick="closeRecommendModal()">&times;</span>
            <h2 id="recommendTitle">Recommend this anime?</h2>
            <p id="recommendStatusText" style="min-height: 1.2em; font-weight: 700;"></p>
            <div class="add-category-box">
                <input type="text" id="recommenderName" placeholder="Your Name (optional)">
                <button id="confirmRecommendBtn" class="btn-yes" style="width:100%;">✨ Recommend</button>
                <input type="text" id="website" name="website" style="display:none;" tabindex="-1" autocomplete="off">
            </div>
        </div>
    </div>

    <script src="search.js"></script>
    <script src="main.js"></script>
</body>
</html>
