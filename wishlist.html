<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍿 My Watchlist</h1>
        <p>Anime I'm planning to watch!</p>
    </header>

    <div id="nav-placeholder"></div>

    <!-- Admin-only: search to add a new item directly -->
    <div id="adminAddBox" style="display:none;">
        <div class="recommend-form" style="max-width: 500px; margin: 20px auto;">
            <input type="text" id="wishlistSearchInput" placeholder="Search an anime to add...">
            <button id="wishlistSearchBtn">Search</button>
        </div>
        <p id="wishlistSearchHint" class="search-hint"></p>
        <div id="wishlistSearchResults" class="scroll-container"></div>
    </div>

    <section id="wishlistGrid" class="anime-grid"></section>

    <div id="removeModal" class="modal">
        <div class="modal-content">
            <span class="closeBtn" onclick="closeRemoveModal()">&times;</span>
            <h2>Are you sure?</h2>
            <p id="removeText">This will permanently delete it.</p>
            <div class="modal-buttons-horizontal">
                <button id="confirmRemove" class="btn-yes">Yes, Delete</button>
                <button id="cancelRemove" class="btn-no" onclick="closeRemoveModal()">No, Keep it</button>
            </div>
        </div>
    </div>

    <script src="wishlist.js"></script>
    <script src="main.js"></script>
</body>
</html>
