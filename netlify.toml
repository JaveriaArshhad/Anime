[build]
  functions = "netlify/functions"

[dev]
  publish = "."
  functions = "netlify/functions"
  port = 8888

# TEMPORARY: sends every page to the maintenance flyer while the database
# is down. To bring the real site back, just delete this block.
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/watched"
  to = "/watched.html"
  status = 200

[[redirects]]
  from = "/notcompleted"
  to = "/notcompleted.html"
  status = 200

[[redirects]]
  from = "/wishlist"
  to = "/wishlist.html"
  status = 200

[[redirects]]
  from = "/recommendation"
  to = "/recommendation.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200